<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ajedrez con bot (local)</title>
  <style>
    /* ========== ESTILOS ========== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #2c3e50;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #0e5ab0;
    }

    .contenedor {
      background: #34495e;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
    }
    h1 { margin-bottom: 15px; font-size: 2em; color: #f1c40f; }
    .panel {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-bottom: 15px;
    }
    select, button {
      padding: 10px 20px;
      font-size: 1em;
      border: none;
      border-radius: 6px;
      background: #ecf0f1;
      color: #2c3e50;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    select:hover, button:hover { background: #bdc3c7; }
    .tablero {
      display: grid;
      grid-template-columns: repeat(8, 60px);
      grid-template-rows: repeat(8, 60px);
      border: 3px solid #1a252f;
      margin: 0 auto;
      width: fit-content;
      background: #1a252f;
    }
    .tablero-contenedor {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin: 0 auto;
    }
    .tablero-middle {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tablero-etiquetas-horizontal,
    .tablero-etiquetas-vertical {
      display: flex;
      gap: 6px;
      font-size: 0.9em;
      color: #ecf0f1;
      font-weight: bold;
    }
    .tablero-etiquetas-horizontal {
      justify-content: center;
    }
    .tablero-etiquetas-horizontal span,
    .tablero-etiquetas-vertical span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 60px;
      height: 20px;
    }
    .tablero-etiquetas-vertical {
      flex-direction: column;
      justify-content: center;
    }
    .tablero-etiquetas-vertical span {
      width: 20px;
      height: 60px;
    }
    .casilla {
      width: 60px; height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      cursor: pointer;
      user-select: none;
      position: relative;
    }
    .clara  { background-color: #eee8d5; }
    .oscura { background-color: #0ea2d8; }
    .seleccionada { box-shadow: inset 0 0 0 4px #f1c40f; }
    .destino::after {
      content: "";
      position: absolute;
      width: 20px; height: 20px;
      background: rgba(0,255,0,0.5);
      border-radius: 50%;
    }
    .destino.captura::after {
      width: 50px; height: 50px;
      border-radius: 50%;
      border: 3px solid rgba(0,255,0,0.8);
      background: transparent;
    }
    .info { margin-top: 15px; font-size: 1.1em; }
    .historial {
      margin-top: 10px;
      max-height: 120px;
      overflow-y: auto;
      text-align: left;
      background: #2c3e50;
      padding: 8px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.9em;
      width: 480px;
      margin-left: auto; margin-right: auto;
    }
    button.descarga { margin-top: 10px; }
    .promocion-dialog {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #ecf0f1;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.7);
      z-index: 1000;
      display: flex;
      gap: 15px;
    }
    .promocion-dialog button {
      font-size: 36px;
      width: 60px; height: 60px;
      padding: 0;
    }
    #stockfish-status {
      display: inline-block;
      margin-left: 10px;
      font-weight: bold;
      color: #f1c40f;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <h1>♟ Ajedrez + bot</h1>
    <div class="panel">
      <select id="modo">
        <option value="2" selected>Dos jugadores</option>
        <option value="3">Contra bot</option>
      </select>
      <select id="dificultad">
        <option value="1">Muy fácil</option>
        <option value="2">Fácil</option>
        <option value="3" selected>Medio</option>
        <option value="4">Difícil</option>
        <option value="5">Experto</option>
      </select>
      <button id="nuevaPartida">Nueva partida</button>
    </div>
    <div class="tablero-contenedor">
      <div class="tablero-etiquetas-horizontal">
        <span></span><span>a</span><span>b</span><span>c</span><span>d</span>
        <span>e</span><span>f</span><span>g</span><span>h</span><span></span>
      </div>
      <div class="tablero-middle">
        <div class="tablero-etiquetas-vertical">
          <span>8</span><span>7</span><span>6</span><span>5</span>
          <span>4</span><span>3</span><span>2</span><span>1</span>
        </div>
        <div class="tablero" id="tablero"></div>
        <div class="tablero-etiquetas-vertical">
          <span>8</span><span>7</span><span>6</span><span>5</span>
          <span>4</span><span>3</span><span>2</span><span>1</span>
        </div>
      </div>
      <div class="tablero-etiquetas-horizontal">
        <span></span><span>a</span><span>b</span><span>c</span><span>d</span>
        <span>e</span><span>f</span><span>g</span><span>h</span><span></span>
      </div>
    </div>
    <div class="info" id="info">Turno de blancas <span id="stockfish-status"></span></div>
    <div class="historial" id="historial"></div>
    <button class="descarga" id="descargar">Descargar movimientos (.txt)</button>
  </div>
  <!-- Carga local de Stockfish desde la carpeta stockfish -->
  <script src="../stockfish/stockfish.js"></script>

  <script>
    // ==================== MODELO DE AJEDREZ (sin cambios, igual que antes) ====================
    const Color = { BLANCO: 'blanco', NEGRO: 'negro' };
    const Tipo = { REY: 'rey', REINA: 'reina', TORRE: 'torre', ALFIL: 'alfil', CABALLO: 'caballo', PEON: 'peon' };

    class Pieza {
      constructor(tipo, color) {
        this.tipo = tipo;
        this.color = color;
      }
      get simbolo() {
        const map = {
          rey: { blanco: '♔', negro: '♚' },
          reina: { blanco: '♕', negro: '♛' },
          torre: { blanco: '♖', negro: '♜' },
          alfil: { blanco: '♗', negro: '♝' },
          caballo: { blanco: '♘', negro: '♞' },
          peon: { blanco: '♙', negro: '♟' }
        };
        return map[this.tipo][this.color];
      }
    }

    class Movimiento {
      constructor(df, dc, hf, hc, pieza, capturada = null) {
        this.desdeFila = df; this.desdeCol = dc;
        this.hastaFila = hf; this.hastaCol = hc;
        this.piezaMovida = pieza;
        this.piezaCapturada = capturada;
        this.enroqueCorto = false; this.enroqueLargo = false;
        this.promocion = false; this.piezaPromocion = null;
        this.capturaAlPaso = false;
        this.filaPeonCapturado = -1; this.colPeonCapturado = -1;
      }
      aNotacion() {
        const col = c => String.fromCharCode(97 + c);
        const letra = {
          rey: 'R',
          reina: 'D',
          torre: 'T',
          alfil: 'A',
          caballo: 'C',
          peon: ''
        }[this.piezaMovida.tipo];
        const destino = col(this.hastaCol) + (8 - this.hastaFila);
        if  (this.enroqueCorto) return '0-0';
        if (this.enroqueLargo) return '0-0-0';
        const captura = this.piezaCapturada ? 'x' : '';
        if (this.piezaMovida.tipo === Tipo.PEON) {
          return (captura ? col(this.desdeCol) + captura : '') + destino +
                 (this.promocion ? '=' + { reina:'D', torre:'T', alfil:'A', caballo:'C' }[this.piezaPromocion] : '');
        }
        return letra + captura + destino +
               (this.promocion ? '=' + { reina:'D', torre:'T', alfil:'A', caballo:'C' }[this.piezaPromocion] : '');
      }
    }

    class Tablero {
      constructor() {
        this.inicializar();
      }

      inicializar() {
        this.casillas = Array.from({ length: 8 }, () => Array(8).fill(null));
        this.turno = Color.BLANCO;
        this.puedeEnrocarCortoBlanco = true; this.puedeEnrocarLargoBlanco = true;
        this.puedeEnrocarCortoNegro = true; this.puedeEnrocarLargoNegro = true;
        this.filaPeonDoble = -1; this.colPeonDoble = -1;

        // Piezas negras (fila 0,1)
        this.casillas[0][0] = new Pieza(Tipo.TORRE, Color.NEGRO);
        this.casillas[0][1] = new Pieza(Tipo.CABALLO, Color.NEGRO);
        this.casillas[0][2] = new Pieza(Tipo.ALFIL, Color.NEGRO);
        this.casillas[0][3] = new Pieza(Tipo.REINA, Color.NEGRO);
        this.casillas[0][4] = new Pieza(Tipo.REY, Color.NEGRO);
        this.casillas[0][5] = new Pieza(Tipo.ALFIL, Color.NEGRO);
        this.casillas[0][6] = new Pieza(Tipo.CABALLO, Color.NEGRO);
        this.casillas[0][7] = new Pieza(Tipo.TORRE, Color.NEGRO);
        for (let j = 0; j < 8; j++) this.casillas[1][j] = new Pieza(Tipo.PEON, Color.NEGRO);

        // Piezas blancas (fila 6,7)
        for (let j = 0; j < 8; j++) this.casillas[6][j] = new Pieza(Tipo.PEON, Color.BLANCO);
        this.casillas[7][0] = new Pieza(Tipo.TORRE, Color.BLANCO);
        this.casillas[7][1] = new Pieza(Tipo.CABALLO, Color.BLANCO);
        this.casillas[7][2] = new Pieza(Tipo.ALFIL, Color.BLANCO);
        this.casillas[7][3] = new Pieza(Tipo.REINA, Color.BLANCO);
        this.casillas[7][4] = new Pieza(Tipo.REY, Color.BLANCO);
        this.casillas[7][5] = new Pieza(Tipo.ALFIL, Color.BLANCO);
        this.casillas[7][6] = new Pieza(Tipo.CABALLO, Color.BLANCO);
        this.casillas[7][7] = new Pieza(Tipo.TORRE, Color.BLANCO);
      }

      piezaEn(f, c) {
        if (f < 0 || f > 7 || c < 0 || c > 7) return null;
        return this.casillas[f][c];
      }

      movimientosLegales(f, c) {
        const pieza = this.piezaEn(f, c);
        if (!pieza || pieza.color !== this.turno) return [];
        const destinos = [];
        switch (pieza.tipo) {
          case Tipo.PEON: this.agregarMovPeon(f, c, pieza.color, destinos); break;
          case Tipo.CABALLO: this.agregarMovCaballo(f, c, destinos); break;
          case Tipo.ALFIL: this.agregarMovDeslizante(f, c, [[1,1],[1,-1],[-1,1],[-1,-1]], destinos); break;
          case Tipo.TORRE: this.agregarMovDeslizante(f, c, [[1,0],[-1,0],[0,1],[0,-1]], destinos); break;
          case Tipo.REINA:
            this.agregarMovDeslizante(f, c, [[1,1],[1,-1],[-1,1],[-1,-1]], destinos);
            this.agregarMovDeslizante(f, c, [[1,0],[-1,0],[0,1],[0,-1]], destinos);
            break;
          case Tipo.REY: this.agregarMovRey(f, c, destinos); break;
        }

        const movimientos = [];
        for (const [nf, nc] of destinos) {
          const m = this.crearMovimiento(f, c, nf, nc, pieza);
          if (m && this.esLegal(m)) movimientos.push(m);
        }

        // Enroques
        if (pieza.tipo === Tipo.REY) {
          if (pieza.color === Color.BLANCO) {
            if (this.puedeEnrocarCortoBlanco && !this.casillas[7][5] && !this.casillas[7][6] &&
                !this.estaAtacada(7,4,Color.NEGRO) && !this.estaAtacada(7,5,Color.NEGRO) && !this.estaAtacada(7,6,Color.NEGRO)) {
              const m = new Movimiento(7,4,7,6,pieza);
              m.enroqueCorto = true;
              if (this.esLegal(m)) movimientos.push(m);
            }
            if (this.puedeEnrocarLargoBlanco && !this.casillas[7][3] && !this.casillas[7][2] && !this.casillas[7][1] &&
                !this.estaAtacada(7,4,Color.NEGRO) && !this.estaAtacada(7,3,Color.NEGRO) && !this.estaAtacada(7,2,Color.NEGRO)) {
              const m = new Movimiento(7,4,7,2,pieza);
              m.enroqueLargo = true;
              if (this.esLegal(m)) movimientos.push(m);
            }
          } else {
            if (this.puedeEnrocarCortoNegro && !this.casillas[0][5] && !this.casillas[0][6] &&
                !this.estaAtacada(0,4,Color.BLANCO) && !this.estaAtacada(0,5,Color.BLANCO) && !this.estaAtacada(0,6,Color.BLANCO)) {
              const m = new Movimiento(0,4,0,6,pieza);
              m.enroqueCorto = true;
              if (this.esLegal(m)) movimientos.push(m);
            }
            if (this.puedeEnrocarLargoNegro && !this.casillas[0][3] && !this.casillas[0][2] && !this.casillas[0][1] &&
                !this.estaAtacada(0,4,Color.BLANCO) && !this.estaAtacada(0,3,Color.BLANCO) && !this.estaAtacada(0,2,Color.BLANCO)) {
              const m = new Movimiento(0,4,0,2,pieza);
              m.enroqueLargo = true;
              if (this.esLegal(m)) movimientos.push(m);
            }
          }
        }
        return movimientos;
      }

      crearMovimiento(ff, fc, tf, tc, pieza) {
        const destino = this.piezaEn(tf, tc);
        if (destino && destino.color === pieza.color) return null;
        const m = new Movimiento(ff, fc, tf, tc, pieza, destino);
        // Captura al paso 
        if (pieza.tipo === Tipo.PEON && fc !== tc && !destino) {
          if (this.filaPeonDoble === tf && this.colPeonDoble === tc) {
            const dir = pieza.color === Color.BLANCO ? -1 : 1;
            const peonEnemigo = this.piezaEn(tf - dir, tc);
            if (peonEnemigo && peonEnemigo.tipo === Tipo.PEON && peonEnemigo.color !== pieza.color) {
              m.piezaCapturada = peonEnemigo;
              m.capturaAlPaso = true;
              m.filaPeonCapturado = tf - dir;
              m.colPeonCapturado = tc;
            } else {
              return null;
            }
          } else {
            return null;
          }
        }
        return m;
      }

      esLegal(m) {
        const original = this.casillas[m.hastaFila][m.hastaCol];
        let capturadaAlPaso = null;
        this.casillas[m.hastaFila][m.hastaCol] = this.casillas[m.desdeFila][m.desdeCol];
        this.casillas[m.desdeFila][m.desdeCol] = null;

        if (m.piezaMovida.tipo === Tipo.PEON && m.desdeCol !== m.hastaCol && !original) {
          if (m.capturaAlPaso) {
            capturadaAlPaso = this.casillas[m.filaPeonCapturado][m.colPeonCapturado];
            this.casillas[m.filaPeonCapturado][m.colPeonCapturado] = null;
          } else {
            capturadaAlPaso = this.casillas[m.desdeFila][m.hastaCol];
            this.casillas[m.desdeFila][m.hastaCol] = null;
          }
        }

        if (m.enroqueCorto) {
          const fila = m.desdeFila;
          this.casillas[fila][5] = this.casillas[fila][7];
          this.casillas[fila][7] = null;
        } else if (m.enroqueLargo) {
          const fila = m.desdeFila;
          this.casillas[fila][3] = this.casillas[fila][0];
          this.casillas[fila][0] = null;
        }

        const reySeguro = !this.reyEnJaque(m.piezaMovida.color);

        this.casillas[m.desdeFila][m.desdeCol] = m.piezaMovida;
        this.casillas[m.hastaFila][m.hastaCol] = original;
        if (capturadaAlPaso) {
          if (m.capturaAlPaso) this.casillas[m.filaPeonCapturado][m.colPeonCapturado] = capturadaAlPaso;
          else this.casillas[m.desdeFila][m.hastaCol] = capturadaAlPaso;
        }
        if (m.enroqueCorto) {
          const fila = m.desdeFila;
          this.casillas[fila][7] = this.casillas[fila][5];
          this.casillas[fila][5] = null;
        } else if (m.enroqueLargo) {
          const fila = m.desdeFila;
          this.casillas[fila][0] = this.casillas[fila][3];
          this.casillas[fila][3] = null;
        }
        return reySeguro;
      }

      reyEnJaque(color) {
        for (let i = 0; i < 8; i++) {
          for (let j = 0; j < 8; j++) {
            const p = this.casillas[i][j];
            if (p && p.tipo === Tipo.REY && p.color === color) {
              return this.estaAtacada(i, j, color === Color.BLANCO ? Color.NEGRO : Color.BLANCO);
            }
          }
        }
        return false;
      }

      estaAtacada(f, c, atacante) {
        for (let i = 0; i < 8; i++) {
          for (let j = 0; j < 8; j++) {
            const p = this.casillas[i][j];
            if (p && p.color === atacante) {
              if (p.tipo === Tipo.PEON) {
                const dir = p.color === Color.BLANCO ? -1 : 1;
                if (f === i + dir && (c === j - 1 || c === j + 1)) return true;
              } else if (p.tipo === Tipo.CABALLO) {
                if ((Math.abs(f - i) === 2 && Math.abs(c - j) === 1) ||
                    (Math.abs(f - i) === 1 && Math.abs(c - j) === 2)) return true;
              } else if (p.tipo === Tipo.REY) {
                if (Math.abs(f - i) <= 1 && Math.abs(c - j) <= 1) return true;
              } else if (p.tipo === Tipo.ALFIL) {
                if (Math.abs(f - i) === Math.abs(c - j) && this.caminoLibre(i, j, f, c)) return true;
              } else if (p.tipo === Tipo.TORRE) {
                if ((f === i || c === j) && this.caminoLibre(i, j, f, c)) return true;
              } else if (p.tipo === Tipo.REINA) {
                if ((f === i || c === j || Math.abs(f - i) === Math.abs(c - j)) && this.caminoLibre(i, j, f, c)) return true;
              }
            }
          }
        }
        return false;
      }

      caminoLibre(fi, fj, ti, tj) {
        const incF = Math.sign(ti - fi);
        const incC = Math.sign(tj - fj);
        let i = fi + incF, j = fj + incC;
        while (i !== ti || j !== tj) {
          if (this.casillas[i][j] !== null) return false;
          i += incF;
          j += incC;
        }
        return true;
      }

      ejecutarMovimiento(m) {
        const filaPD = this.filaPeonDoble, colPD = this.colPeonDoble;

        if (m.enroqueCorto) {
          const fila = m.desdeFila;
          this.casillas[fila][m.hastaCol] = this.casillas[fila][m.desdeCol];
          this.casillas[fila][m.desdeCol] = null;
          this.casillas[fila][5] = this.casillas[fila][7];
          this.casillas[fila][7] = null;
        } else if (m.enroqueLargo) {
          const fila = m.desdeFila;
          this.casillas[fila][m.hastaCol] = this.casillas[fila][m.desdeCol];
          this.casillas[fila][m.desdeCol] = null;
          this.casillas[fila][3] = this.casillas[fila][0];
          this.casillas[fila][0] = null;
        } else {
          this.casillas[m.hastaFila][m.hastaCol] = m.piezaMovida;
          this.casillas[m.desdeFila][m.desdeCol] = null;

          // Captura al paso (corregido)
          if (m.piezaMovida.tipo === Tipo.PEON && m.desdeCol !== m.hastaCol) {
            if (filaPD === m.hastaFila && colPD === m.hastaCol) {
              const dir = m.piezaMovida.color === Color.BLANCO ? -1 : 1;
              const filaPeon = m.hastaFila - dir;
              if (filaPeon >= 0 && filaPeon < 8) {
                this.casillas[filaPeon][m.hastaCol] = null;
              }
            }
          }

          if (m.promocion) {
            this.casillas[m.hastaFila][m.hastaCol] = new Pieza(m.piezaPromocion, m.piezaMovida.color);
          }
        }

        if (m.piezaMovida.tipo === Tipo.REY) {
          if (m.piezaMovida.color === Color.BLANCO) {
            this.puedeEnrocarCortoBlanco = false;
            this.puedeEnrocarLargoBlanco = false;
          } else {
            this.puedeEnrocarCortoNegro = false;
            this.puedeEnrocarLargoNegro = false;
          }
        }
        if (m.piezaMovida.tipo === Tipo.TORRE) {
          if (m.desdeFila === 7 && m.desdeCol === 0) this.puedeEnrocarLargoBlanco = false;
          if (m.desdeFila === 7 && m.desdeCol === 7) this.puedeEnrocarCortoBlanco = false;
          if (m.desdeFila === 0 && m.desdeCol === 0) this.puedeEnrocarLargoNegro = false;
          if (m.desdeFila === 0 && m.desdeCol === 7) this.puedeEnrocarCortoNegro = false;
        }

        this.filaPeonDoble = -1; this.colPeonDoble = -1;
        if (m.piezaMovida.tipo === Tipo.PEON && Math.abs(m.hastaFila - m.desdeFila) === 2) {
          this.filaPeonDoble = (m.desdeFila + m.hastaFila) / 2;
          this.colPeonDoble = m.hastaCol;
        }
        this.turno = this.turno === Color.BLANCO ? Color.NEGRO : Color.BLANCO;
      }

      hayMovimientosLegales() {
        for (let i = 0; i < 8; i++) {
          for (let j = 0; j < 8; j++) {
            const p = this.casillas[i][j];
            if (p && p.color === this.turno) {
              if (this.movimientosLegales(i, j).length > 0) return true;
            }
          }
        }
        return false;
      }

      agregarMovPeon(f, c, color, lista) {
        const dir = color === Color.BLANCO ? -1 : 1;
        const inicio = color === Color.BLANCO ? 6 : 1;
        if (!this.piezaEn(f + dir, c)) {
          lista.push([f + dir, c]);
          if (f === inicio && !this.piezaEn(f + 2 * dir, c)) lista.push([f + 2 * dir, c]);
        }
        if (c > 0) {
          const diagIzq = this.piezaEn(f + dir, c - 1);
          if (diagIzq && diagIzq.color !== color) lista.push([f + dir, c - 1]);
          else if (f + dir === this.filaPeonDoble && c - 1 === this.colPeonDoble) lista.push([f + dir, c - 1]);
        }
        if (c < 7) {
          const diagDer = this.piezaEn(f + dir, c + 1);
          if (diagDer && diagDer.color !== color) lista.push([f + dir, c + 1]);
          else if (f + dir === this.filaPeonDoble && c + 1 === this.colPeonDoble) lista.push([f + dir, c + 1]);
        }
      }

      agregarMovCaballo(f, c, lista) {
        const saltos = [[2,1],[2,-1],[-2,1],[-2,-1],[1,2],[1,-2],[-1,2],[-1,-2]];
        for (const [df, dc] of saltos) {
          const nf = f + df, nc = c + dc;
          if (nf >= 0 && nf < 8 && nc >= 0 && nc < 8) {
            const dest = this.piezaEn(nf, nc);
            if (!dest || dest.color !== this.turno) lista.push([nf, nc]);
          }
        }
      }

      agregarMovDeslizante(f, c, dirs, lista) {
        for (const [df, dc] of dirs) {
          let nf = f + df, nc = c + dc;
          while (nf >= 0 && nf < 8 && nc >= 0 && nc < 8) {
            const dest = this.piezaEn(nf, nc);
            if (!dest) {
              lista.push([nf, nc]);
            } else {
              if (dest.color !== this.turno) lista.push([nf, nc]);
              break;
            }
            nf += df; nc += dc;
          }
        }
      }

      agregarMovRey(f, c, lista) {
        for (let i = -1; i <= 1; i++) {
          for (let j = -1; j <= 1; j++) {
            if (i === 0 && j === 0) continue;
            const nf = f + i, nc = c + j;
            if (nf >= 0 && nf < 8 && nc >= 0 && nc < 8) {
              const dest = this.piezaEn(nf, nc);
              if (!dest || dest.color !== this.turno) lista.push([nf, nc]);
            }
          }
        }
      }
    }

    // ==================== INTERFAZ GRÁFICA (variables globales) ====================
    const tablero = new Tablero();
    let juegoTerminado = false;
    let modoJuego = '2';              // '2' = dos jugadores, '3' = Stockfish
    let dificultad = 3;              // valor del select (1-5)
    let filaSeleccionada = -1, colSeleccionada = -1;
    let movimientosPosibles = [];
    const historial = [];

    const tableroDiv = document.getElementById('tablero');
    const infoDiv = document.getElementById('info');
    const historialDiv = document.getElementById('historial');
    const statusSpan = document.getElementById('stockfish-status');

    let stockfishWorker = null;
    let stockfishReady = false;
    let stockfishThinking = false;
    let stockfishMejorMovimiento = null;

    // ==================== MOTOR DE IA LOCAL (sin dependencias externas) ====================
    class MotorAjedrez {
      constructor(dificultad = 3) {
        this.dificultad = dificultad;
        this.valorPieza = { peon: 1, caballo: 3, alfil: 3, torre: 5, reina: 9, rey: 0 };
      }

      evaluarPosicion(tablero) {
        let score = 0;
        for (let i = 0; i < 8; i++) {
          for (let j = 0; j < 8; j++) {
            const p = tablero.casillas[i][j];
            if (!p) continue;
            const valor = this.valorPieza[p.tipo];
            if (p.color === Color.NEGRO) score += valor;
            else score -= valor;
          }
        }
        return score;
      }

      buscarMejorMovimiento(tablero, profundidad = 3) {
        const movimientos = [];
        for (let i = 0; i < 8; i++) {
          for (let j = 0; j < 8; j++) {
            const p = tablero.casillas[i][j];
            if (p && p.color === tablero.turno) {
              movimientos.push(...tablero.movimientosLegales(i, j));
            }
          }
        }
        if (movimientos.length === 0) return null;

        let mejorMov = movimientos[0];
        let mejorScore = -Infinity;

        for (const mov of movimientos) {
          const scoreTemp = this.minimax(tablero, profundidad - 1, false, mov);
          if (scoreTemp > mejorScore) {
            mejorScore = scoreTemp;
            mejorMov = mov;
          }
        }
        return mejorMov;
      }

      minimax(tablero, profundidad, esMax, movimiento) {
        const original = tablero.casillas[movimiento.hastaFila][movimiento.hastaCol];
        tablero.casillas[movimiento.hastaFila][movimiento.hastaCol] = tablero.casillas[movimiento.desdeFila][movimiento.desdeCol];
        tablero.casillas[movimiento.desdeFila][movimiento.desdeCol] = null;
        tablero.turno = tablero.turno === Color.BLANCO ? Color.NEGRO : Color.BLANCO;

        let score;
        if (profundidad === 0 || !tablero.hayMovimientosLegales()) {
          score = this.evaluarPosicion(tablero);
        } else {
          const movimientos = [];
          for (let i = 0; i < 8; i++) {
            for (let j = 0; j < 8; j++) {
              const p = tablero.casillas[i][j];
              if (p && p.color === tablero.turno) {
                movimientos.push(...tablero.movimientosLegales(i, j));
              }
            }
          }

          if (esMax) {
            score = -Infinity;
            for (const m of movimientos) {
              score = Math.max(score, this.minimax(tablero, profundidad - 1, false, m));
            }
          } else {
            score = Infinity;
            for (const m of movimientos) {
              score = Math.min(score, this.minimax(tablero, profundidad - 1, true, m));
            }
          }
        }

        tablero.casillas[movimiento.desdeFila][movimiento.desdeCol] = tablero.casillas[movimiento.hastaFila][movimiento.hastaCol];
        tablero.casillas[movimiento.hastaFila][movimiento.hastaCol] = original;
        tablero.turno = tablero.turno === Color.BLANCO ? Color.NEGRO : Color.BLANCO;
        return score;
      }
    }

    function iniciarStockfish(skillLevel) {
      if (stockfishWorker) { 
        if (stockfishWorker.terminate) stockfishWorker.terminate(); 
        stockfishWorker = null; 
      }
      stockfishReady = false;
      stockfishThinking = false;
      statusSpan.textContent = '';
      // if (typeof SharedArrayBuffer === 'undefined') {
      //   statusSpan.textContent = 'SharedArrayBuffer no disponible; Stockfish puede no funcionar';
      // }

      const motor = new MotorAjedrez(dificultad);
      stockfishWorker = motor;
      
      setTimeout(() => {
        stockfishReady = true;
        statusSpan.textContent = 'Listo';
        if (modoJuego === '3' && tablero.turno === Color.NEGRO && !juegoTerminado) {
          pedirMovimientoStockfish();
        }
      }, 100);
    }

    /**
     * Convierte el tablero a notación FEN y le pide a Stockfish el mejor movimiento.
     * Utiliza `go depth N` donde N depende de la dificultad.
     */
    function pedirMovimientoStockfish() {
      if (!stockfishReady || stockfishThinking) return;
      stockfishThinking = true;
      stockfishMejorMovimiento = null;
      statusSpan.textContent = 'Pensando...';

      setTimeout(() => {
        const movimiento = stockfishWorker.buscarMejorMovimiento(tablero, 2 + dificultad);
        stockfishThinking = false;
        statusSpan.textContent = '';
        if (movimiento) {
          aplicarMovimiento(movimiento);
        }
      }, 500);
    }

    /** Genera la cadena FEN del tablero actual.
     */
    function tableroAFEN() {
      let fen = '';
      for (let i = 0; i < 8; i++) {
        let vacias = 0;
        for (let j = 0; j < 8; j++) {
          const p = tablero.casillas[i][j];
          if (!p) { vacias++; continue; }
          if (vacias > 0) { fen += vacias; vacias = 0; }
          const c = { peon: 'p', caballo: 'n', alfil: 'b', torre: 'r', reina: 'q', rey: 'k' }[p.tipo];
          fen += p.color === Color.BLANCO ? c.toUpperCase() : c;
        }
        if (vacias > 0) fen += vacias;
        if (i < 7) fen += '/';
      }
      fen += tablero.turno === Color.BLANCO ? ' w' : ' b';
      let enroques = '';
      if (tablero.puedeEnrocarCortoBlanco) enroques += 'K';
      if (tablero.puedeEnrocarLargoBlanco) enroques += 'Q';
      if (tablero.puedeEnrocarCortoNegro) enroques += 'k';
      if (tablero.puedeEnrocarLargoNegro) enroques += 'q';
      fen += ' ' + (enroques || '-');
      if (tablero.filaPeonDoble !== -1)
        fen += ' ' + String.fromCharCode(97 + tablero.colPeonDoble) + (8 - tablero.filaPeonDoble);
      else fen += ' -';
      fen += ' 0 1';
      return fen;
    }

    /** Convierte el movimiento UCI (ej: "e2e4") en un objeto Movimiento válido
     * y lo ejecuta en el tablero.
     */
    function procesarMovimientoStockfish(uci) {
      if (!uci || uci.length < 4) return;
      const colDesde = uci.charCodeAt(0) - 97;
      const filaDesde = 8 - parseInt(uci[1]);
      const colHasta = uci.charCodeAt(2) - 97;
      const filaHasta = 8 - parseInt(uci[3]);
      const promocion = uci.length === 5 ? uci[4] : null;

      const movimientos = [];
      for (let i = 0; i < 8; i++) {
        for (let j = 0; j < 8; j++) {
          const p = tablero.casillas[i][j];
          if (p && p.color === tablero.turno) movimientos.push(...tablero.movimientosLegales(i, j));
        }
      }
      const movimiento = movimientos.find(m => {
        if (m.desdeCol !== colDesde || m.desdeFila !== filaDesde ||
            m.hastaCol !== colHasta || m.hastaFila !== filaHasta) return false;
        if (promocion) {
          const piezaProm = { q: Tipo.REINA, r: Tipo.TORRE, b: Tipo.ALFIL, n: Tipo.CABALLO }[promocion.toLowerCase()];
          return m.promocion && m.piezaPromocion === piezaProm;
        }
        return true;
      });

      if (movimiento) aplicarMovimiento(movimiento);
      else console.warn('Movimiento de Stockfish no válido, ignorado');
    }

    /** Mapea nivel de dificultad (1..5) a Skill Level (0,5,10,15,20) */
    function dificultadToSkill(nivel) {
      // Mapear 1->0, 2->5, 3->10, 4->15, 5->20
      return (nivel - 1) * 5;
    }

    // ==================== MOVIMIENTO DEL BOT (UNIFICADO) ====================
    function hacerMovimientoBot() {
      if (modoJuego === '3') {
        // Modo Stockfish
        if (!stockfishReady) {
          // Si aún no está listo, esperar a que lo esté
          return;
        }
        if (stockfishThinking) return; // ya está pensando
        pedirMovimientoStockfish();
      }
    }

    // ==================== APLICAR MOVIMIENTO (común) ====================
    function aplicarMovimiento(m) {
      tablero.ejecutarMovimiento(m);
      historial.push(m);
      filaSeleccionada = -1;
      colSeleccionada = -1;
      movimientosPosibles = [];
      verificarFinJuego();
      dibujarTablero();

      if (!juegoTerminado && modoJuego === '3' && tablero.turno === Color.NEGRO) {
        hacerMovimientoBot();
      }
    }

    // ==================== RESTO DE LA INTERFAZ (sin cambios importantes) ====================
    function dibujarTablero() {
      tableroDiv.innerHTML = '';
      for (let f = 0; f < 8; f++) {
        for (let c = 0; c < 8; c++) {
          const casilla = document.createElement('div');
          casilla.className = 'casilla ' + ((f + c) % 2 === 0 ? 'clara' : 'oscura');
          casilla.dataset.fila = f;
          casilla.dataset.col = c;

          if (f === filaSeleccionada && c === colSeleccionada) casilla.classList.add('seleccionada');
          if (movimientosPosibles.some(m => m.hastaFila === f && m.hastaCol === c)) {
            casilla.classList.add('destino');
            if (tablero.piezaEn(f, c)) casilla.classList.add('captura');
          }

          const pieza = tablero.piezaEn(f, c);
          if (pieza) casilla.textContent = pieza.simbolo;
          casilla.addEventListener('click', () => manejarClick(f, c));
          tableroDiv.appendChild(casilla);
        }
      }
      infoDiv.childNodes[0].textContent = `Turno de ${tablero.turno === Color.BLANCO ? 'blancas' : 'negras'} `;
      actualizarHistorial();
    }

    function manejarClick(f, c) {
      if (juegoTerminado) return;
      if (modoJuego === '3' && tablero.turno === Color.NEGRO) return; // turno del bot

      if (filaSeleccionada === -1) {
        const pieza = tablero.piezaEn(f, c);
        if (pieza && pieza.color === tablero.turno) {
          filaSeleccionada = f;
          colSeleccionada = c;
          movimientosPosibles = tablero.movimientosLegales(f, c);
        }
      } else {
        const movimiento = movimientosPosibles.find(m => m.hastaFila === f && m.hastaCol === c);
        if (movimiento) {
          ejecutarMovimiento(movimiento);
        } else {
          const pieza = tablero.piezaEn(f, c);
          if (pieza && pieza.color === tablero.turno) {
            filaSeleccionada = f; colSeleccionada = c;
            movimientosPosibles = tablero.movimientosLegales(f, c);
          } else {
            filaSeleccionada = -1; colSeleccionada = -1;
            movimientosPosibles = [];
          }
        }
      }
      dibujarTablero();
    }

    function ejecutarMovimiento(m) {
      if (m.piezaMovida.tipo === Tipo.PEON && (m.hastaFila === 0 || m.hastaFila === 7)) {
        mostrarDialogoPromocion(m);
        return;
      }
      aplicarMovimiento(m);
    }

    function mostrarDialogoPromocion(m) {
      const dialog = document.createElement('div');
      dialog.className = 'promocion-dialog';
      const piezas = [Tipo.REINA, Tipo.TORRE, Tipo.ALFIL, Tipo.CABALLO];
      piezas.forEach(tipo => {
        const btn = document.createElement('button');
        btn.textContent = new Pieza(tipo, m.piezaMovida.color).simbolo;
        btn.onclick = () => {
          m.promocion = true;
          m.piezaPromocion = tipo;
          document.body.removeChild(dialog);
          aplicarMovimiento(m);
        };
        dialog.appendChild(btn);
      });
      document.body.appendChild(dialog);
    }

    function verificarFinJuego() {
      if (!tablero.hayMovimientosLegales()) {
        if (tablero.reyEnJaque(tablero.turno)) {
          const ganador = tablero.turno === Color.BLANCO ? 'negras' : 'blancas';
          infoDiv.childNodes[0].textContent = `¡Jaque mate! Gana ${ganador} `;
        } else {
          infoDiv.childNodes[0].textContent = '¡Ahogado! (Tablas) ';
        }
        juegoTerminado = true;
        statusSpan.textContent = '';
      }
    }
    function actualizarHistorial() {
      historialDiv.innerHTML = historial.map((m, i) => `${i+1}. ${m.aNotacion()}`).join(' ');
    }

    function descargarMovimientos() {
      const texto = historial.map((m, i) => `${i+1}. ${m.aNotacion()}`).join('\n');
      const blob = new Blob([texto], {type: 'text/plain'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'movimientos.txt';
      a.click();
      URL.revokeObjectURL(url);
    }

    // ==================== EVENTOS ====================
    document.getElementById('nuevaPartida').addEventListener('click', () => {
      tablero.inicializar();
      tablero.turno = Color.BLANCO;
      juegoTerminado = false;
      filaSeleccionada = colSeleccionada = -1;
      movimientosPosibles = [];
      historial.length = 0;
      dibujarTablero();
      // Solo si estamos en modo Stockfish y es turno de negras (por si se reinició en un momento extraño)
      if (modoJuego === '3' && tablero.turno === Color.NEGRO) {
        hacerMovimientoBot();
      }
    });

    document.getElementById('modo').addEventListener('change', (e) => {
      modoJuego = e.target.value;
      if (modoJuego === '3') {
        iniciarStockfish(dificultadToSkill(dificultad));
      } else if (stockfishWorker) {
        stockfishWorker = null;
        stockfishReady = false;
        stockfishThinking = false;
        statusSpan.textContent = '';
      }
    });

    document.getElementById('dificultad').addEventListener('change', (e) => {
      dificultad = parseInt(e.target.value);
      if (modoJuego === '3') {
        // Actualizar Skill Level de Stockfish sobre la marcha
        if (stockfishWorker && stockfishReady) {
          stockfishWorker.dificultad = dificultad;
        }
      }
    });

    document.getElementById('descargar').addEventListener('click', descargarMovimientos);

    // ==================== INICIALIZACIÓN ====================
    modoJuego = document.getElementById('modo').value;
    dificultad = parseInt(document.getElementById('dificultad').value);
    if (modoJuego === '3') iniciarStockfish(dificultadToSkill(dificultad));
    dibujarTablero();
  </script>
</body>
